[package]
name = "mcservernap"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Wake a local Minecraft Java server on demand and stop it after an idle period"
license = "MIT"
readme = "README.md"
repository = "https://github.com/marshmallowsunshinekitten1234/MCServerNap"
keywords = ["minecraft", "server", "proxy", "rcon"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
